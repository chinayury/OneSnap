name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify tag matches package.json version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($tag -ne $version) {
            throw "tag (${{ github.ref_name }}) does not match package.json version ($version)"
          }
          Write-Output "Version: $version"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Build
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          wails build -clean -ldflags "-X main.Version=v$version"

      - name: Package
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/bin/OneSnap.exe')) { throw 'OneSnap.exe not produced' }
          Compress-Archive -Path 'build/bin/OneSnap.exe' -DestinationPath "OneSnap-$env:VERSION-Windows-x64.zip" -Force
          Get-Item "OneSnap-$env:VERSION-Windows-x64.zip" | Select-Object Name, Length

      - name: Publish and verify package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $package = "OneSnap-$env:VERSION-Windows-x64.zip"
          $endpoint = "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME"
          gh release create $env:GITHUB_REF_NAME $package --verify-tag --title $env:GITHUB_REF_NAME --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = gh api $endpoint | ConvertFrom-Json
          $asset = @($release.assets | Where-Object name -eq $package)
          $digest = 'sha256:' + (Get-FileHash $package -Algorithm SHA256).Hash
          if ($release.draft -or $asset.Count -ne 1 -or $asset[0].state -ne 'uploaded' -or $asset[0].digest -ne $digest) {
            throw 'Published package verification failed'
          }

      - name: Remove older release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $endpoint = "repos/$env:GITHUB_REPOSITORY/releases"
          $pages = gh api --paginate --slurp $endpoint | ConvertFrom-Json -NoEnumerate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($page in $pages) {
            foreach ($release in $page) {
              if ($release.draft -or $release.prerelease -or $release.tag_name -notmatch '^v(\d+\.\d+\.\d+)$') { continue }
              if ([version]$Matches[1] -ge [version]$env:VERSION) { continue }
              foreach ($asset in $release.assets) {
                gh api -X DELETE "$endpoint/assets/$($asset.id)" | Out-Null
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
            }
          }
