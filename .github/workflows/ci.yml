name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build backend
        run: go build ./...

      # Win32 syscall interop reads OS-heap pointers; the unsafeptr
      # checker cannot prove those conversions safe, so it is scoped off.
      - name: Vet
        run: go vet -unsafeptr=false ./...

      - name: Test
        run: go test ./...

      - name: Full Wails build
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          wails build -clean
